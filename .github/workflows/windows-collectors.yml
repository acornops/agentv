name: Windows native collectors

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      first_call_diagnostic:
        description: Capture one production-bounded first call on disposable hosted runners
        type: boolean
        default: false
      component_composition:
        description: Observe one cold snapshot plus four tool reads (not startup qualification)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-collectors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-collectors:
    name: Native collectors (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - name: Reject ambiguous diagnostic selection before any collectors
        if: github.event_name == 'workflow_dispatch' && inputs.first_call_diagnostic && inputs.component_composition
        shell: pwsh
        run: throw 'Select exactly one native observation.'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify Windows read runtime and service entry gate
        run: npx vitest run src/config.spec.ts src/windows-runtime.spec.ts src/windows-service-entry.spec.ts src/windows
      - name: Measure the first native call in an owned diagnostic job
        if: github.event_name == 'workflow_dispatch' && inputs.first_call_diagnostic && !inputs.component_composition
        shell: pwsh
        env:
          AGENTV_FIRST_CALL_ALLOW: 'true'
        run: ./scripts/windows-tests/first-call-native.ps1 -AllowDisposableCi
      - name: Observe cold component composition in an owned diagnostic job
        if: github.event_name == 'workflow_dispatch' && inputs.component_composition && !inputs.first_call_diagnostic
        shell: pwsh
        env:
          AGENTV_OVERLAP_ALLOW: 'true'
        run: ./scripts/windows-tests/overlap-native.ps1 -AllowDisposableCi
      - name: Verify composition redaction and fail-closed assignment
        if: always() && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.component_composition)) && !(inputs.first_call_diagnostic && inputs.component_composition)
        shell: pwsh
        env:
          AGENTV_OVERLAP_ALLOW: 'true'
        run: |
          node --test scripts/windows-tests/overlap-evidence.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Composition fixture checks failed.' }
          ./scripts/windows-tests/overlap-metadata-tests.ps1
          ./scripts/windows-tests/overlap-native.ps1 -AllowDisposableCi -TestAssignmentFailure
      - name: Verify diagnostic redaction and independent watchdog cleanup
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.first_call_diagnostic || inputs.component_composition) && !(inputs.first_call_diagnostic && inputs.component_composition)
        shell: pwsh
        env:
          AGENTV_FIRST_CALL_ALLOW: 'true'
        run: |
          node --test scripts/windows-tests/first-call-evidence.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic redaction checks failed.' }
          ./scripts/windows-tests/first-call-metadata-tests.ps1
          ./scripts/windows-tests/first-call-native.ps1 -AllowDisposableCi -TestWatchdog
      - name: Read native collectors and capture sanitized structural evidence
        if: github.event_name != 'workflow_dispatch' || (!inputs.first_call_diagnostic && !inputs.component_composition)
        run: node scripts/windows-collector-smoke.mjs
      - name: Upload structural evidence and runner provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-collectors-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            artifacts/windows-collectors/native-structure.json
            artifacts/windows-collectors/first-call-diagnostic.json
            artifacts/windows-collectors/first-call-watchdog-test.json
            artifacts/windows-collectors/overlap-native.json
            artifacts/windows-collectors/overlap-assignment-test.json
          if-no-files-found: warn
          retention-days: 14
