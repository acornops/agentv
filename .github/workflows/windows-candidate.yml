name: Windows candidate preparation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/windows-change-scope.yml
  candidate:
    needs: changes
    if: needs.changes.outputs.run_native == 'true'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test reboot evidence decisions (synthetic; no reboot qualification)
        run: node --test scripts/windows-qualification/reboot-evidence.test.mjs
      - name: Parse qualification scripts with PowerShell 5.1
        shell: powershell
        run: ./scripts/windows-tests/parse-package-tests.ps1
      - name: Exercise native reboot evaluator CLI (synthetic)
        shell: powershell
        run: ./scripts/windows-tests/reboot-cli-tests.ps1
      - name: Build candidate assets without publishing
        shell: powershell
        run: ./scripts/build-windows-archive.ps1
      - name: Verify candidate identity and corruption rejection
        shell: powershell
        run: ./scripts/windows-tests/candidate-tests.ps1
      - name: Retain unqualified candidate assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-candidate-${{ github.sha }}
          path: |
            release/windows/agentv-*-windows-x64.zip
            release/windows/agentv-*-windows-x64.zip.sha256
            release/windows/install-agentv.ps1
            release/windows/install-agentv.ps1.sha256
            release/windows/candidate-evidence.json
          if-no-files-found: error
          retention-days: 14
